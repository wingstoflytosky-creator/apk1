name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "NeonStrike3D"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f project.godot || {
            echo "::error::project.godot is missing from repository root"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "::error::export_presets.cfg is missing from repository root"
            exit 1
          }

          grep -q 'platform="Android"' export_presets.cfg || {
            echo "::error::No Android preset found in export_presets.cfg"
            exit 1
          }

          echo "Godot project and Android export preset found."

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -e

          mkdir -p ~/.local/share/godot/export_templates

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -a \
              "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              ~/.local/share/godot/export_templates/
          fi

      - name: Import Godot project
        shell: bash
        run: |
          godot --headless --editor --path . --quit-after 30 || true

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          mkdir -p build/android

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            "build/android/${EXPORT_NAME}.apk"

          test -f "build/android/${EXPORT_NAME}.apk" || {
            echo "::error::APK was not created"
            exit 1
          }

          echo "APK successfully created:"
          ls -lh "build/android/${EXPORT_NAME}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: NeonStrike3D-Android-APK
          path: build/android/NeonStrike3D.apk
          if-no-files-found: error
          retention-days: 14
