name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "NeonStrike3D"
  PROJECT_PATH: "."

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/

          if [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot ~/.config/godot
          fi

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -r \
              /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/
          fi

      - name: Check project
        shell: bash
        run: |
          test -f project.godot || {
            echo "ERROR: project.godot not found at repository root"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "ERROR: export_presets.cfg not found"
            exit 1
          }

          grep -q 'platform="Android"' export_presets.cfg || {
            echo "ERROR: Android export preset not found"
            exit 1
          }

          echo "Project files are OK"

      - name: Import project
        shell: bash
        run: |
          godot --headless --editor --path "$PROJECT_PATH" --quit || true

      - name: Build Android APK
        shell: bash
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --verbose \
            --path "$PROJECT_PATH" \
            --export-debug "Android" \
            "build/android/${EXPORT_NAME}.apk"

          test -f "build/android/${EXPORT_NAME}.apk" || {
            echo "ERROR: APK was not generated"
            exit 1
          }

          ls -lh build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: NeonStrike3D-Android-APK
          path: build/android/NeonStrike3D.apk
          if-no-files-found: error
          retention-days: 14
